# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: '3'

vars:
  CLANG_FORMAT: '{{default "build/tooling/clang-format-18/usr/bin/clang-format-18" .CLANG_FORMAT}}'
  DOXYGEN: '{{default "doxygen" .DOXYGEN}}'
  GCOVR: '{{default "gcovr" .GCOVR}}'

tasks:
  quality:format-setup:
    desc: Provision pinned ClangFormat 18 locally when it is not installed
    cmds:
      - cmake -DROOT={{.ROOT_DIR}} -DOUTPUT={{.ROOT_DIR}}/build/tooling/clang-format-18 -P cmake/setup_clang_format.cmake
    status:
      - '{{.CLANG_FORMAT}} --version | grep -q ''version 18\.'''

  quality:format:
    desc: Format owned Corelib and example sources with pinned ClangFormat 18
    deps: [quality:format-setup]
    cmds:
      - '{{.PYTHON}} tools/check_signatures.py --fix'
      - cmake -DROOT={{.ROOT_DIR}} -DCLANG_FORMAT={{.CLANG_FORMAT}} -DMODE=APPLY -P cmake/format_owned.cmake

  quality:format-check:
    desc: Verify owned source formatting and one-line function signatures
    deps: [quality:format-setup]
    cmds:
      - cmake -DROOT={{.ROOT_DIR}} -DCLANG_FORMAT={{.CLANG_FORMAT}} -DMODE=CHECK -P cmake/format_owned.cmake
      - '{{.PYTHON}} tools/check_signatures.py'

  quality:heap:
    desc: Verify that the portable core does not reference heap allocators
    deps: [native:build]
    cmds:
      - cmake -DNM=nm -DLIBRARY={{.ROOT_DIR}}/{{.BUILD_DIR}}/libcorelib_device.a -P cmake/check_heap.cmake
      - cmake -DNM=nm -DLIBRARY={{.ROOT_DIR}}/{{.BUILD_DIR}}/libcorelib_gateway.a -P cmake/check_heap.cmake

  quality:no-gateway:
    desc: Verify the standard-only library contains no gateway implementation
    cmds:
      - cmake -S . -B build/no-gateway -DCORELIB_BUILD_GATEWAY=OFF
      - cmake --build build/no-gateway --parallel
      - cmake -DNM=nm -DLIBRARY={{.ROOT_DIR}}/build/no-gateway/libcorelib_device.a -P cmake/check_no_gateway.cmake

  quality:docs:
    desc: Lint owned comments and verify generated public API reference pages
    cmds:
      - cmake -E make_directory build/docs/api build/docs/lint
      - '{{.DOXYGEN}} docs/Doxyfile'
      - '{{.DOXYGEN}} docs/Doxyfile.lint'
      - '{{.PYTHON}} tools/docs_api.py --check'
      - '{{.PYTHON}} tools/check_terminology.py'
    preconditions:
      - sh: command -v {{.DOXYGEN}}
        msg: Doxygen must be installed to build API documentation

  quality:misra:
    desc: Run blocking MISRA C:2012 analysis on the owned C implementation
    cmds:
      - for:
          var: MISRA_PLATFORMS
        cmd: >-
          {{.CPPCHECK}}
          src/corelib/device.c src/corelib/gateway.c
          src/protocol/pfp.c src/protocol/transaction.c
          --std=c11 --language=c --platform={{.ITEM}} -Isrc
          '-DUINT32_C(value)=value##U'
          --addon=config/cppcheck/misra.json
          --suppressions-list=config/cppcheck/misra-suppressions.txt
          --enable=warning,style,performance,portability
          --suppress=missingIncludeSystem --error-exitcode=1
          --template='{file}:{line}:{column}: {severity}: {message} [{id}]'
    vars:
      MISRA_PLATFORMS: unix32 unix64
    preconditions:
      - sh: '{{.CPPCHECK}} --version'
        msg: Cppcheck with its MISRA addon must be installed

  docs:setup:
    desc: Install the locked VitePress toolchain
    cmds:
      - npm ci
    status:
      - npm list --depth=0 vitepress@1.6.4

  docs:api:
    desc: Regenerate committed VitePress API reference pages
    cmds:
      - cmake -E make_directory build/docs/api
      - '{{.DOXYGEN}} docs/Doxyfile'
      - '{{.PYTHON}} tools/docs_api.py'
    preconditions:
      - sh: command -v {{.DOXYGEN}}
        msg: Doxygen must be installed to generate API documentation

  docs:api-check:
    desc: Verify API reference pages match public source comments
    cmds:
      - task: quality:docs

  docs:build:
    desc: Build the VitePress documentation site
    cmds:
      - task: docs:setup
      - task: quality:docs
      - npm run docs:build -- --base {{.DOCS_BASE}}
    vars:
      DOCS_BASE: '{{default "/" .DOCS_BASE}}'
      DOCS_OUT_DIR: '{{default "build/docs/site" .DOCS_OUT_DIR}}'
    env:
      CORELIB_DOCS_OUT_DIR: '{{.DOCS_OUT_DIR}}'

  docs:versions:check:
    desc: Test documentation version discovery and report deployable tags
    cmds:
      - '{{.PYTHON}} -m unittest discover -s tools/tests -p ''test_docs_*.py'''
      - '{{.PYTHON}} tools/docs_versions.py list'

  docs:versions:build:
    desc: Assemble Latest and retained release documentation for GitHub Pages
    cmds:
      - >-
        {{.PYTHON}} tools/docs_versions.py build
        --output {{.DOCS_OUT_DIR}}
        --site-origin {{.DOCS_SITE_ORIGIN}}
        --project-base {{.DOCS_PROJECT_BASE}}
    vars:
      DOCS_OUT_DIR: '{{default "build/docs/site" .DOCS_OUT_DIR}}'
      DOCS_SITE_ORIGIN: '{{default "https://epicecu.github.io" .DOCS_SITE_ORIGIN}}'
      DOCS_PROJECT_BASE: '{{default "/corelib/" .DOCS_PROJECT_BASE}}'

  docs:serve:
    desc: Validate and serve the VitePress documentation site locally
    cmds:
      - task: docs:setup
      - task: quality:docs
      - npm run docs:dev -- --host 127.0.0.1 --port {{.DOCS_PORT}}
    vars:
      DOCS_PORT: '{{default "8000" .DOCS_PORT}}'

  quality:fuzz:
    desc: Build fuzz targets with Clang
    cmds:
      - cmake -S . -B build/fuzz -DCMAKE_C_COMPILER=clang -DCORELIB_BUILD_FUZZERS=ON -DCORELIB_BUILD_GATEWAY=ON
      - cmake --build build/fuzz --parallel

  quality:coverage:
    desc: Generate native Corelib line and branch coverage reports
    deps: [native:configure]
    cmds:
      - cmake -E remove_directory build/coverage
      - cmake -S . -B build/coverage -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++ -DFETCHCONTENT_SOURCE_DIR_GOOGLETEST={{.ROOT_DIR}}/build/_deps/googletest-src -DCORELIB_ETL_ROOT={{.ROOT_DIR}}/build/tooling/etl -DCORELIB_BUILD_TESTS=ON -DCORELIB_BUILD_CPP=ON -DCORELIB_BUILD_GATEWAY=ON -DCORELIB_BUILD_EXAMPLES=ON -DCORELIB_ENABLE_COVERAGE=ON
      - cmake --build build/coverage --parallel
      - ctest --test-dir build/coverage --output-on-failure
      - '{{.ROOT_DIR}}/build/coverage/corelib_device_consumer'
      - cmake -E make_directory build/coverage/report
      - '{{.GCOVR}} --root . build/coverage --filter src/corelib/ --filter src/protocol/ --exclude src/protocol/v2/generated/ --exclude src/vendor/ --txt build/coverage/report/coverage.txt --html-details build/coverage/report/index.html --xml build/coverage/report/coverage.xml --xml-pretty --print-summary --fail-under-line 85'
    preconditions:
      - sh: command -v {{.GCOVR}}
        msg: gcovr must be installed to generate code coverage reports
